    <script>
        const API = "https://api-affiliate.oddin.gg/795b8a71-9fb4-430a-a090-e96d3c6e85c7/matches.json"

        fetch(API)
            .then((response) => response.json())
            .then(getMatches)
            .then(renderMatches)
            .catch((err) => console.error('Failed to fetch', err))

        function getMatches(data) {
            try {
                const activeSport = 'Valorant'

                return data.matches.filter((match) => match.sport === activeSport)
            } catch (e) {
                console.error('Failed to get matches', data)
            }
        }

        function getFallbackIcon() {

                    return "data:image/svg+xml;base64,PHN2ZyBjbGFzcz0idmFsb3JhbnQiIGZpbGw9IiM2MTc3OTIiIHN0eWxlPSJlbmFibGUtYmFja2dyb3VuZDpuZXcgMCAwIDMyIDMyO2hlaWdodDoxOHB4O3dpZHRoOjE4cHg7IiB2aWV3Qm94PSIwIDAgMzIgMzIiCiAgICAgICAgICAgICAgICAgICAgeG1sOnNwYWNlPSJwcmVzZXJ2ZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiB4bWxuczp4bGluaz0iaHR0cDovL3d3dy53My5vcmcvMTk5OS94bGluayI+CiAgICAgICAgICAgICAgICAgICAgPGc+CiAgICAgICAgICAgICAgICAgICAgICAgIDxwYXRoCiAgICAgICAgICAgICAgICAgICAgICAgICAgICBkPSJNMTkuOCwyNi4xaC0wLjJjLTIuNCwwLTQuOCwwLTcuMiwwYy0wLjMsMC0wLjUtMC4xLTAuNi0wLjNjLTIuNS0zLjItNS4xLTYuMy03LjYtOS41QzQuMSwxNi4xLDQsMTYsNCwxNS44ICAgYzAtMy4xLDAtNi4xLDAtOS4yYzAtMC4xLDAtMC4yLDAuMS0wLjJoMC4xYzUuMiw2LjUsMTAuNCwxMywxNS41LDE5LjVjMCwwLDAsMC4xLDAuMSwwLjFMMTkuOCwyNi4xTDE5LjgsMjYuMXoiIC8+CiAgICAgICAgICAgICAgICAgICAgICAgIDxwYXRoCiAgICAgICAgICAgICAgICAgICAgICAgICAgICBkPSJNMjcuOCwxNi4zYy0wLjcsMC45LTEuNSwxLjgtMi4yLDIuOGMtMC4yLDAuMi0wLjQsMC4zLTAuNiwwLjNjLTIuNCwwLTQuOCwwLTcuMSwwYzAsMC0wLjEsMC0wLjEsMGMtMC4xLDAtMC4yLTAuMS0wLjEtMC4yICAgYzAsMCwwLTAuMSwwLjEtMC4xYzIuNC0zLDQuNy01LjksNy4xLTguOWMxLTEuMiwyLTIuNSwyLjktMy43YzAtMC4xLDAuMS0wLjEsMC4yLTAuMWMwLDAsMC4xLDAsMC4xLDBjMCwwLjEsMCwwLjEsMCwwLjIgICBjMCwzLDAsNi4xLDAsOS4xQzI4LDE2LDI3LjksMTYuMiwyNy44LDE2LjNMMjcuOCwxNi4zeiIgLz4KICAgICAgICAgICAgICAgICAgICA8L2c+CiAgICAgICAgICAgICAgICA8L3N2Zz4="
                default:
                    return "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
            }
        }

        function renderMatch(match) {

            document.querySelector('.banner_link').href = match.link

            document.querySelector('.home .team h2').innerHTML = match.home.name
            document.querySelector('.home .team .odds').innerHTML = formatOddsToString(match.home.odds)
            document.querySelector('.home img').src = match.home.icon ?? getFallbackIcon()

            document.querySelector('.away .team h2').innerHTML = match.away.name
            document.querySelector('.away .team .odds').innerHTML = formatOddsToString(match.away.odds)
            document.querySelector('.away img').src = match.away.icon ?? getFallbackIcon()
        }

        function preloadNextMatch(match) {
            if (match) {
                if (match.home.icon) {
                    (new Image()).src = match.home.icon;
                }
                if (match.away.icon) {
                    (new Image()).src = match.away.icon;
                }
            }
        }

        function formatOddsToString(odds, decimalPlaces = 2) {
            if (odds == null) {
                return '-'
            }

            const separator = (1.1).toString().substring(1, 2)
            const [number, decimal = ''] = odds.toString().split(separator)

            return `${number}${separator}${decimal.padEnd(decimalPlaces, '0')}`
        }

        function renderMatches(matches) {
            if (matches) {
                const validMatches = []

                for (const match of matches) {
                    try {
                        const matchWinner = match.markets.find(market => market.type === "MatchWinner")

                        if (matchWinner) {
                            const homeSelection = matchWinner.selections.find((selection) => selection.type === "home")
                            const awaySelection = matchWinner.selections.find((selection) => selection.type === "away")

                            if (homeSelection && awaySelection) {
                                validMatches.push({
                                    link: match.matchURL,
                                    home: {
                                        name: match.homeTeam.name,
                                        icon: match.homeTeam.iconPath,
                                        odds: homeSelection.value
                                    },
                                    away: {
                                        name: match.awayTeam.name,
                                        icon: match.awayTeam.iconPath,
                                        odds: awaySelection.value
                                    }
                                })
                            }
                        }
                    } catch (e) {
                        console.error('Failed to process match', match)
                    }
                }

                if (validMatches.length) {
                    let currentIdx = 0

                    renderMatch(validMatches[currentIdx])

                    setInterval(() => {
                        currentIdx += 1

                        if (currentIdx > validMatches.length - 1) {
                            currentIdx = 0
                        }

                        renderMatch(validMatches[currentIdx])
                        preloadNextMatch(validMatches[currentIdx + 1])
                    }, 5_000)
                } else {
                    console.error('No valid matches', matches)
                }
            } else {
                console.error('No matches found')
            }
        }
    </script>
